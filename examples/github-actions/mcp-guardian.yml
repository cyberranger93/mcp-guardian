name: MCP Guardian

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan MCP server risk
        uses: cyberranger93/mcp-guardian@v0
        with:
          path: .
          config: .mcp-guardian.json
          fail-on: high

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: node dist/cli.js scan . --config .mcp-guardian.json --fail-on high --format github

name: Publish Package to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'cyberranger93/mcp-guardian'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: node dist/cli.js scan . --config .mcp-guardian.json --fail-on high --format github
      - run: npm publish --access public
